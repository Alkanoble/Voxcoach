[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxcoach"
version = "0.1.0"
description = "English speech tutor powered by AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "firebase-admin>=6.5.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "google-generativeai>=0.8.0",
    "librosa>=0.10.0",
    "pydub>=0.25.1",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "faster-whisper>=1.0.0",
    "g2p-en>=2.1.0",
    "groq>=0.9.0",
    "pronouncing>=0.2.0",
    "setuptools<70.0.0",
    "textblob>=0.18.0",
    "textstat>=0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "main.py"]
